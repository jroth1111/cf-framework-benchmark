name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dataset tests
        run: pnpm test:dataset

      - name: Build
        run: pnpm -r build

      - name: Install Playwright browsers
        run: pnpm -C bench exec playwright install --with-deps chromium

      - name: Live preflight
        run: pnpm verify:live
