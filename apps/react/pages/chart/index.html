<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CF Bench React</title>
    <link rel="stylesheet" href="/src/main.css" />
    <script>
      (function () {
        var w = window;
        w.__CF_BENCH__ = w.__CF_BENCH__ || {};
        var h = (w.__CF_BENCH__.hydration = w.__CF_BENCH__.hydration || {});
        if (h.startMs == null) h.startMs = performance.now();
      })();
    </script>
  </head>
  <body>
    <div id="root"><header class="container nav"><a class="brand" href="/" data-discover="true">CF Bench</a><nav class="links"><a class="pill" href="/stays" data-discover="true">Stays</a><a aria-current="page" class="pill active" href="/chart" data-discover="true">Chart</a><a class="pill" href="/media" data-discover="true">Media</a><a class="pill" href="/blog" data-discover="true">Blog</a></nav></header><main class="container"><h1 class="h1">Chart (SPA-like)</h1><div class="card" style="padding:14px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div class="pill"><span class="muted small">Symbol</span><select data-testid="symbol-select" class="input" style="width:140px"><option value="BTC" selected="">BTC</option><option value="ETH">ETH</option><option value="SOL">SOL</option><option value="AAPL">AAPL</option><option value="TSLA">TSLA</option><option value="NVDA">NVDA</option><option value="GOOG">GOOG</option><option value="MSFT">MSFT</option></select></div><div class="pill"><span class="muted small">Timeframe</span><select data-testid="timeframe-select" class="input" style="width:120px"><option value="1m">1m</option><option value="5m">5m</option><option value="15m">15m</option><option value="1h" selected="">1h</option><option value="4h">4h</option><option value="1d">1d</option></select></div><div style="display:flex;align-items:center;gap:10px"><label class="muted small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" checked=""/>SMA20</label><label class="muted small" style="display:flex;gap:6px;align-items:center"><input type="checkbox"/>SMA50</label><label class="muted small" style="display:flex;gap:6px;align-items:center"><input type="checkbox"/>EMA20</label><label class="muted small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" checked=""/>Volume</label></div><div class="muted small">Ready</div></div><div class="muted small" style="margin-top:10px">Pan: drag • Zoom: mousewheel/trackpad • Crosshair: move cursor</div><div style="height:420px;margin-top:12px;position:relative"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:12px;border:1px solid var(--border)"><span class="muted">Loading chart…</span></div><canvas data-testid="chart-canvas" style="width:100%;height:100%;border-radius:12px;border:1px solid var(--border);opacity:0;transition:opacity 0.2s ease-in-out"></canvas></div></div><div class="footer">React SPA variant • client-side routing via react-router-dom.</div></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
