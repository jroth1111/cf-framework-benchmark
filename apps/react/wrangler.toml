name = "cf-bench-react"
compatibility_date = "2026-03-05"
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "drop-trailing-slash"
run_worker_first = ["/", "/stays", "/stays/*", "/blog", "/blog/*", "/chart", "/media", "/api/*"]
[vars]
NODE_ENV = "production"
