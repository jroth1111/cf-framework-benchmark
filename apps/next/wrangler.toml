name = "cf-bench-next"
compatibility_date = "2026-03-05"
compatibility_flags = ["nodejs_compat", "nodejs_als", "global_fetch_strictly_public"]

# OpenNext output (generated by build step) typically lives in .open-next
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
html_handling = "drop-trailing-slash"

[vars]
NODE_ENV = "production"
